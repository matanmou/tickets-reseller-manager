# Apache vhost for the Tickets Reseller Flask app (mod_wsgi, daemon mode).
#
# Install steps (run as root):
#   sudo apt install libapache2-mod-wsgi-py3
#   sudo cp /home/devops/tickets-reseller/apache/tickets-reseller.conf \
#           /etc/apache2/sites-available/tickets-reseller.conf
#   sudo a2ensite tickets-reseller
#   sudo a2dissite 000-default        # optional, if this is the only site on :80
#   # Apache worker (www-data) needs to read+write data.json:
#   sudo chown www-data:www-data /home/devops/tickets-reseller/data.json
#   sudo systemctl reload apache2
#
# Logs:
#   sudo tail -f /var/log/apache2/tickets-reseller-error.log
#
# Note: if you change app code, reload Apache (`sudo systemctl reload apache2`)
# so mod_wsgi picks up the new files. Touching wsgi.py also forces a reload.

<VirtualHost *:80>
    ServerName  tickets.local
    # ServerAlias tickets.example.com

    WSGIDaemonProcess tickets-reseller \
        python-home=/home/devops/tickets-reseller/venv \
        python-path=/home/devops/tickets-reseller \
        processes=2 threads=4
    WSGIProcessGroup  tickets-reseller
    WSGIScriptAlias / /home/devops/tickets-reseller/wsgi.py

    <Directory /home/devops/tickets-reseller>
        Require all granted
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/tickets-reseller-error.log
    CustomLog ${APACHE_LOG_DIR}/tickets-reseller-access.log combined
</VirtualHost>
