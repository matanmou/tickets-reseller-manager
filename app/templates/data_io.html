{% extends "base.html" %}
{% block title %}Data{% endblock %}
{% block content %}

<h1 class="mb-4">Data</h1>

<p class="text-muted">All changes auto-save to <code>{{ path }}</code>. Use these controls only for explicit save/reload.</p>

<div class="card shadow-sm">
  <div class="card-body d-flex gap-2 flex-wrap">
    <form method="post" class="d-inline">
      <input type="hidden" name="action" value="save">
      <button class="btn btn-primary">Save current state</button>
    </form>
    <form method="post" class="d-inline">
      <input type="hidden" name="action" value="reload">
      <button class="btn btn-outline-secondary">Reload from file</button>
    </form>
  </div>
</div>

{% endblock %}
